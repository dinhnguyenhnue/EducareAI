<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trò chơi ôn tập</title>
<style>body{font:18px system-ui;background:#eff6ff;color:#172554;margin:0;padding:24px}main{max-width:700px;margin:auto}button{font:inherit;padding:14px;margin:6px 0;border:2px solid #2563eb;border-radius:12px;background:white;color:#172554;cursor:pointer;display:block;width:100%;text-align:left}button:focus-visible{outline:4px solid #f59e0b}button:disabled{opacity:.6;cursor:default}#feedback{min-height:60px;line-height:1.6}#next{background:#2563eb;color:white}h1{font-size:28px}progress{width:100%}</style>
<main><h1 id="title"></h1><p>Chọn một đáp án mỗi câu. Mỗi câu đúng được 1 điểm. Đọc giải thích rồi sang câu tiếp theo.</p><p>Demo luyện tập — không ghi vào điểm chính thức.</p><progress id="progress"></progress><h2 id="question"></h2><div id="options"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next">Bắt đầu</button></main>
<script>const data={"title":"Thám tử Truyện & Ngôi kể — Bài 1, 2, 3 (SGK Ngữ văn 6 KNTT Tập 1)","questions":[{"question":"Theo Phụ lục 2 (tr. 135) và Bài 1, đặc điểm nào đúng với 'truyện đồng thoại' như Bài học đường đời đầu tiên?","options":["Chỉ kể về các vị thần cổ xưa","Nhân vật thường là loài vật hoặc đồ vật được nhân hóa","Viết hoàn toàn bằng thể thơ lục bát","Luôn sử dụng ngôi kể thứ ba"],"answer":1,"explanation":"Truyện đồng thoại sáng tác cho trẻ em, nhân vật thường là loài vật hoặc đồ vật được nhân hóa mang tính cách, tâm lí như con người."},{"question":"Văn bản 'Bài học đường đời đầu tiên' (tr. 12) do ai kể chuyện và theo ngôi nào?","options":["Tô Hoài kể theo ngôi thứ ba","Dế Choắt kể theo ngôi thứ nhất","Dế Mèn kể theo ngôi thứ nhất","Chị Cốc kể theo ngôi thứ ba"],"answer":2,"explanation":"Dế Mèn trực tiếp xưng 'tôi' kể lại quãng đời bồng bột và bài học ân hận của chính mình (ngôi thứ nhất)."},{"question":"Trong 'Nếu cậu muốn có một người bạn...' (Bài 1, tr. 21), theo lời con cáo, 'cảm hóa' có nghĩa là gì?","options":["Bắt ép người khác nghe theo ý mình","Tạo ra những mối liên hệ, gắn bó đặc biệt và biết quan tâm nhau","Lẩn trốn khỏi mọi người xung quanh","Chạy đua thi xem ai nhanh hơn"],"answer":1,"explanation":"Con cáo giải thích 'cảm hóa' là làm cho nhau trở nên duy nhất và gắn bó trong tình bạn đầy trách nhiệm."},{"question":"Bài thơ 'Mây và sóng' của Ta-go (Bài 2, tr. 44) mang đặc điểm nổi bật nào của thơ?","options":["Có yếu tố tự sự (kể cuộc trò chuyện) và yếu tố miêu tả giàu tưởng tượng","Chỉ toàn lời bàn luận chính trị","Tuân thủ chặt chẽ luật đường thi 8 câu 7 chữ","Không có hình ảnh thiên nhiên nào"],"answer":0,"explanation":"Bài thơ kể lại cuộc đối thoại tưởng tượng giữa em bé với người trên mây, trong sóng để tôn vinh tình mẫu tử."},{"question":"Trong truyện 'Bức tranh của em gái tôi' (Bài 2, tr. 48), chi tiết người anh nhận ra tấm lòng nhân hậu của Kiều Phương diễn ra khi nào?","options":["Khi em gái mới bắt đầu pha màu vẽ","Khi đứng trước bức tranh đạt giải Nhất vẽ chính mình","Khi Kiều Phương đi thi về muộn","Khi bố mẹ khen em gái học giỏi toán"],"answer":1,"explanation":"Đứng trước bức tranh 'Anh trai tôi' ở phòng triển lãm, người anh giật mình thấy mình trong mắt em gái thật đẹp đẽ, trong sáng."},{"question":"Trong 'Gió lạnh đầu mùa' (Bài 3, tr. 67), hành động nào của Sơn và chị Lan thể hiện tình yêu thương, sẻ chia?","options":["Đóng chặt cửa giữ ấm cho riêng mình","Mang chiếc áo bông cũ của em Duyên tặng cho bé Hiên","Chạy ra chợ mua kẹo cho bạn","Khuyên bé Hiên ở yên trong nhà"],"answer":1,"explanation":"Sơn và Lan động lòng thương cô bạn nghèo phong phanh giữa gió lạnh nên lén đem chiếc áo bông cũ sang cho Hiên."},{"question":"Theo Phụ lục 2 (tr. 135), phát biểu nào ĐÚNG về 'người kể chuyện'?","options":["Luôn trùng khớp hoàn toàn với tiểu sử nhà văn ngoài đời","Là nhân vật do tác giả sáng tạo ra để kể câu chuyện","Chỉ xuất hiện trong văn bản nhật dụng","Bắt buộc phải xưng 'tôi' trong mọi tác phẩm"],"answer":1,"explanation":"Người kể chuyện là vai kể do tác giả sáng tạo ra để dẫn dắt, kể lại chuỗi sự việc; không đồng nhất máy móc với tác giả."},{"question":"Khi viết bài văn 'Kể lại một trải nghiệm của em' (Bài 1 tr. 28 & Bài 3 tr. 77), yếu tố nào KHÔNG thể thiếu?","options":["Chuyển toàn bộ bài sang ngôi thứ ba","Bỏ qua cảm xúc cá nhân để chỉ liệt kê giờ giấc","Dùng ngôi thứ nhất, có diễn biến chi tiết và bài học rút ra","Gắn tên một nhà văn nổi tiếng làm người kể"],"answer":2,"explanation":"Bài văn kể trải nghiệm yêu cầu nhất quán ngôi thứ nhất, kể rõ hoàn cảnh – diễn biến – chi tiết tiêu biểu và cảm xúc/bài học."}]};let index=-1,score=0,answered=false;
const el=id=>document.getElementById(id);el('title').textContent=data.title;el('progress').max=data.questions.length;el('progress').value=0;
function show(){answered=false;el('options').replaceChildren();el('feedback').textContent='';el('progress').value=index;
if(index>=data.questions.length){el('question').textContent='Hoàn thành: '+score+'/'+data.questions.length+' điểm';el('next').textContent='Chơi lại';el('next').disabled=false;return;}
const q=data.questions[index];el('question').textContent=(index+1)+'. '+q.question;el('next').textContent='Câu tiếp theo';el('next').disabled=true;
q.options.forEach((option,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>{if(answered)return;answered=true;if(i===q.answer)score++;el('feedback').textContent=(i===q.answer?'Đúng! ':'Chưa đúng. Đáp án: '+q.options[q.answer]+'. ')+q.explanation;Array.from(el('options').children).forEach(x=>x.disabled=true);el('next').disabled=false;};el('options').append(b);});}
el('next').onclick=()=>{if(index>=data.questions.length){index=0;score=0;}else index++;show();};</script></html>
